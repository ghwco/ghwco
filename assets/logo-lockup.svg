<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Golden Hour Wellness Colorado">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5C86E"/>
      <stop offset="55%" stop-color="#E9A65D"/>
      <stop offset="100%" stop-color="#DE8C58"/>
    </linearGradient>
    <linearGradient id="ridgeBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D98E63"/>
      <stop offset="100%" stop-color="#C4744A"/>
    </linearGradient>
    <linearGradient id="ridgeFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B5623A"/>
      <stop offset="100%" stop-color="#9A4E32"/>
    </linearGradient>
    <clipPath id="horizon">
      <rect x="0" y="0" width="720" height="176"/>
    </clipPath>
  </defs>

  <g clip-path="url(#horizon)">
    <!-- sun -->
    <circle cx="360" cy="96" r="52" fill="url(#sun)"/>
    <!-- back ridge -->
    <path d="M215 176 L280 108 L316 140 L352 92 L404 148 L448 116 L505 176 Z" fill="url(#ridgeBack)" opacity=".85"/>
    <!-- front ridge -->
    <path d="M186 176 L252 122 L288 152 L338 104 L386 158 L424 132 L470 176 Z" fill="url(#ridgeFront)"/>
    <!-- snowline notches -->
    <path d="M338 104 L354 122 L344 128 L332 118 L322 130 L312 120 Z" fill="#FDF8F2" opacity=".9"/>
  </g>

  <!-- horizon rule -->
  <rect x="186" y="176" width="348" height="3" rx="1.5" fill="#B5623A"/>

  <!-- wordmark -->
  <text x="360" y="232" text-anchor="middle"
        font-family="Fraunces, 'Playfair Display', Georgia, serif"
        font-size="52" font-weight="600" letter-spacing="1" fill="#8E4A2E">GOLDEN HOUR</text>
  <text x="360" y="266" text-anchor="middle"
        font-family="Fraunces, 'Playfair Display', Georgia, serif"
        font-size="32" font-weight="500" letter-spacing="10" fill="#8E4A2E">WELLNESS</text>
  <text x="360" y="292" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="7.5" fill="#4A3550">COLORADO</text>
</svg>
